name: Recycle revenue

# Swaps what the x402 endpoints have earned (and nothing else) into RRB, hourly.
# scripts/buyback.mjs compares all-time endpoint revenue with scripts/buyback-state.json
# and swaps the difference; a successful swap commits the updated state file.
# Schedule: hourly at :07 UTC (GitHub cron is best-effort and may lag).
# Needs:
#   secret   BANKR_API_KEY     a dedicated Bankr key: read-write, Wallet API on, x402 on
#   variable BUYBACK_ENABLED   set to "true" to arm the hourly schedule (forks stay silent)
# Optional variables override script defaults: RRB_ADDRESS, USDC_RESERVE, MAX_SWAP_USD, MIN_SWAP_USD.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the plan without swapping"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: buyback
  cancel-in-progress: false

jobs:
  buyback:
    if: github.event_name == 'workflow_dispatch' || vars.BUYBACK_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Bankr CLI
        run: npm install -g @bankr/cli
      - name: Log in
        env:
          BANKR_API_KEY: ${{ secrets.BANKR_API_KEY }}
        run: |
          if [ -z "$BANKR_API_KEY" ]; then echo "BANKR_API_KEY secret is not set"; exit 1; fi
          bankr login --api-key "$BANKR_API_KEY"
      - name: Run buyback
        env:
          BANKR_API_KEY: ${{ secrets.BANKR_API_KEY }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
          RRB_ADDRESS: ${{ vars.RRB_ADDRESS }}
          USDC_RESERVE: ${{ vars.USDC_RESERVE }}
          MAX_SWAP_USD: ${{ vars.MAX_SWAP_USD }}
          MIN_SWAP_USD: ${{ vars.MIN_SWAP_USD }}
        run: node scripts/buyback.mjs
      - name: Record the swap
        run: |
          if git diff --quiet scripts/buyback-state.json; then exit 0; fi
          total=$(node -p 'require("./scripts/buyback-state.json").recycledUsd.toFixed(2)')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/buyback-state.json
          git commit -m "Recycle revenue: total \$${total}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
